[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "german-invoice-extractor"
version = "0.1.0"
description = "Stateless API for extracting and identifying ZUGFeRD, Factur-X, and XRechnung invoice XML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pypdf>=5.4,<7",
    "reportlab>=4.2,<5",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
]

[project.scripts]
invoice-extractor = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/LICENSE.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
